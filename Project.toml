[sources]
# No registered VlasovMethods binds ReducedComplexityModeling 0.5, which its `main` does.
VlasovMethods = {url = "https://github.com/JuliaPlasma/VlasovMethods.jl", rev = "main"}

[compat]
# the floor of VlasovMethods
GeometricBase = "0.15.1"
GeometricEquations = "0.21.5"
GeometricIntegrators = "0.18.6"
# the floor of GeometricIntegrators 0.18.6
GeometricIntegratorsBase = "0.6.9"
HDF5 = "0.17"
LinearAlgebra = "1"
PoissonSolvers = "0.6"
Printf = "1"
QuadGK = "2.11"
# 0.4 is the first that binds ReducedComplexityModeling 0.5, as VlasovMethods' `main` does.
ReducedBasisMethods = "0.4"
# `ParameterSpace`, which every `ReducedBasis` holds.
ReducedComplexityModeling = "0.5"
# `status` and `isconverged`, which tell whether the nonlinear solve of a step converged
SimpleSolvers = "0.14.1"
SpecialFunctions = "2"
TOML = "1"
VlasovMethods = "0.3"
julia = "1.12"
